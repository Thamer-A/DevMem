users:
  - password: |
      $6$rounds=5000$salt0$hashedvaluehashedvalue0
    name: alice
    uid: 1000
    shell: /bin/bash
    groups:
      - users
      - docker
    ssh_authorized_keys:
      - ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIaliceexample alice@laptop
    sudo: ALL=(ALL) NOPASSWD:ALL
    home: /home/alice
