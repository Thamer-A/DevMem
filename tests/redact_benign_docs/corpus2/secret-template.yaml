apiVersion: v1
kind: Secret
metadata:
  name: app
type: Opaque
stringData:
  # fill these in with your own values; do not commit real ones
  password: ""
  api_key: ""
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
data:
  token_ttl: "3600"
  max_tokens: "4096"
  key_rotation: "90d"
  password_policy: |
    min_length=12
    require_digits=true
  description: |
    Configuration for the app. The password and API key
    live in the Secret above.
