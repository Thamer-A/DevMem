services:
  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
      POSTGRES_USER: app
    secrets:
      - db_password
  web:
    image: example/web:1.4.2
    environment:
      - API_KEY_FILE=/run/secrets/api_key
      - TOKEN_TTL=3600
      - MAX_TOKENS=4096
secrets:
  db_password:
    file: ./secrets/db_password.txt
  api_key:
    file: ./secrets/api_key.txt
