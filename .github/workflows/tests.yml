name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

# a newer push to the same branch or pull request cancels the run still going for the older one
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Install ruff
        run: python -m pip install ruff==0.17.5
      - name: Lint
        run: python -m ruff check plugin/devmem tests evals

  types:
    name: pyright
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Install pyright (the PyPI package downloads Node on first use)
        run: python -m pip install pyright==1.1.414
      - name: Type-check the package
        run: python -m pyright

  pytest:
    name: pytest (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install test tools (the package itself has no dependencies)
        # setuptools 77 or newer (SPDX license field) and wheel: the packaging test builds a wheel with
        # --no-build-isolation. Every tool is pinned to an exact version
        run: python -m pip install pytest==9.2.0 build==1.2.2.post1 wheel==0.46.3 setuptools==79.0.1
      - name: Run tests
        run: python -m pytest -q -p no:cacheprovider
        env:
          PYTHONUTF8: "1"
