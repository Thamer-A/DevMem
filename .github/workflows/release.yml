name: release

# Publishing a GitHub release builds the package and uploads it to PyPI as `dev-memory`.
# No token is stored anywhere: PyPI trusts this workflow through "trusted publishing" (OIDC).
# One-time setup on pypi.org (account -> Publishing -> add a pending publisher):
#   PyPI project name: dev-memory, owner: Thamer-A, repository: DevMem, workflow: release.yml, environment: pypi

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    name: build sdist and wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Build
        run: |
          python -m pip install build==1.2.2.post1 twine==6.1.0
          python -m build
          python -m twine check --strict dist/*
      - name: The tag must match the package version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version=$(PYTHONPATH=plugin python -c "import devmem; print(devmem.__version__)")
          if [ "$TAG" != "v$version" ]; then
            echo "release tag $TAG does not match package version $version (expected v$version)" >&2
            exit 1
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    name: publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/dev-memory/
    permissions:
      id-token: write   # the short-lived identity PyPI checks; nothing else is granted
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
